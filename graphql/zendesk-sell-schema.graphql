# -------------------------------------------------------------------

input AddressInput {
  line1: String
  line2: String
  city: String
  postalCode: String
  state: String
  country: String
}

input CreateContactInput {
  firstName: String
  lastName: String!
  contactType: ContactType
  title: String
  email: String
  phone: String
  mobile: String
  website: String
  address: AddressInput
  ownerId: ID
  organizationId: ID
  tags: [String!]
}

input UpdateContactInput {
  firstName: String
  lastName: String
  title: String
  email: String
  phone: String
  mobile: String
  website: String
  address: AddressInput
  ownerId: ID
  organizationId: ID
  tags: [String!]
}

input CreateDealInput {
  name: String!
  value: Float
  currency: String
  contactId: ID
  stageId: ID!
  pipelineId: ID!
  ownerId: ID
  sourceId: ID
  closeDate: DateTime
  tags: [String!]
}

input UpdateDealInput {
  name: String
  value: Float
  status: DealStatus
  stageId: ID
  ownerId: ID
  closeDate: DateTime
  lostReasonId: ID
  tags: [String!]
}

input CreateLeadInput {
  firstName: String
  lastName: String!
  company: String
  email: String
  phone: String
  title: String
  ownerId: ID
  sourceId: ID
  tags: [String!]
}

input UpdateLeadInput {
  firstName: String
  lastName: String
