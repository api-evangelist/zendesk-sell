aid: zendesk-sell
name: Zendesk Sell
description: Zendesk Sell (formerly Base CRM) is a sales CRM platform that helps sales
  teams manage leads, contacts, deals, and pipelines while integrating with the broader
  Zendesk customer experience suite. The platform offers pipeline analytics, email
  and call tracking, mobile apps, and territory management for high-velocity sales
  organizations. The Sell API is a RESTful API authenticated via OAuth 2.0 (authorization
  code, implicit, password, and refresh token grants) at the api.getbase.com host
  that provides full CRUD access to leads, contacts, deals, accounts, notes, tasks,
  calls, and custom fields, alongside a premium Sync API, a client-pulled Firehose
  change stream and a Search API. Zendesk announced on 2025-09-09 that Sell is being
  retired on 2027-08-31 and is no longer sold as a standalone plan, so the API carries
  a hard end date.
