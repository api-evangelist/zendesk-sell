source: >-
  Public package registries (rubygems.org, pypi.org, packagist.org, repo1.maven.org,
  registry.npmjs.org) plus the github.com/zendesk organization, which hosts the four
  first-party Base CRM / Zendesk Sell API client libraries.
note: >-
  Every first-party Zendesk Sell SDK last shipped in 2021 — the newest release across
  all four official libraries is basecrm (Ruby) 2.0.0 on 2021-10-27. Zendesk announced
  on 2025-09-09 that Sell is retired on 2027-08-31, so the client-library surface is
  frozen. The npm `basecrm` package is a third-party wrapper by an individual author,
  not a Zendesk release. Versions and publish dates were read from each registry's
  metadata endpoint on 2026-08-13.
