search_result: >-
  No first-party MCP server exists for Zendesk Sell. Zendesk's own MCP documentation
  (support.zendesk.com article 10497779528730) describes Zendesk acting as an MCP CLIENT
  that connects OUT to third-party MCP servers from action flows, and notes Zendesk "can
  also act as an MCP server in other scenarios" without publishing an endpoint. That
  capability is scoped to the Suite/Support plans; Zendesk Sell is not named. Every
  zendesk-mcp-server package found on npm/GitHub is community-built and wraps the Zendesk
  SUPPORT API, not the Sell API at api.getbase.com. The tools below are a DERIVED candidate
  set from this repo's OpenAPI — nobody ships them.
