response_headers:
  documented: []
  note: >-
    Zendesk publishes NO rate-limit response headers for the Sell API — the rate-limits page
    documents the numeric ceiling and the 429 status but names no X-Rate-Limit-*,
    RateLimit-* or Retry-After header. An agent therefore has no runtime signal of remaining
    quota and must back off reactively on 429. This is a real gap, not an unchecked field.
